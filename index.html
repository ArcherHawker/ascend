<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0714" />
    <meta name="description" content="Ascend turns real life into an RPG. Complete daily quests, level up your stats, and rise through the tiers." />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ascend" />
    <meta name="format-detection" content="telephone=no" />

    <!-- App icons -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/favicon.ico" color="#0b0714" />

    <!-- Splash background color (visible briefly before app loads) -->
    <style>
      html { background: #0b0714; }
      body { margin: 0; padding: 0; background: #0b0714; overscroll-behavior: none; }
      /* Initial splash — replaced by React app on mount */
      #initial-splash {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: #0b0714; z-index: 9999; transition: opacity 0.4s ease;
      }
      #initial-splash.hidden { opacity: 0; pointer-events: none; }
      #initial-splash .logo {
        font-family: system-ui, -apple-system, sans-serif; font-weight: 900; font-size: 2.5rem;
        background: linear-gradient(135deg, #a78bfa, #f0abfc, #fbbf24);
        -webkit-background-clip: text; background-clip: text; color: transparent;
        animation: pulse 1.8s ease-in-out infinite;
      }
      @keyframes pulse { 0%,100% { opacity: 0.4; transform: scale(0.95); } 50% { opacity: 1; transform: scale(1); } }
    </style>

    <title>Ascend — Level up your real life</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="initial-splash"><div class="logo">A</div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
